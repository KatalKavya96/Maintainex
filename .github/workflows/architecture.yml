name: Architecture and build
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/unused
      JWT_SECRET: isolated-ci-fixture-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-secrets.mjs
      - run: node --test scripts/check-secrets.test.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run prisma:generate --workspace maintainex-server
      - run: npm run build --workspace maintainex-server
      - run: npm run test --workspace maintainex-server
